name: Bug report
description: Something loads, previews or exports incorrectly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: model
    attributes:
      label: About the model
      description: >
        Attach the model if you are allowed to share it. Otherwise describe it:
        the tool that exported it, whether it is animated or skinned, and the
        output of `npx @gltf-transform/cli inspect model.glb` if you can.
  - type: input
    id: settings
    attributes:
      label: Settings used
      description: Forward axis, bake on or off, and any "Reduce size" options.
  - type: dropdown
    id: how
    attributes:
      label: How are you running it?
      options:
        - Docker
        - npm start
        - npm run dev
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, browser, and Node or image version.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server output and anything in the browser console.
      render: text
